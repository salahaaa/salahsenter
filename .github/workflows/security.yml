name: Security Pipeline

on:
  push:
    branches: [main, master, staging]
  pull_request:
    branches: [main, master, staging]
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

# Read-only by default. Jobs request write capability only where required.
permissions:
  contents: read

jobs:
  dependency-and-secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency and secret verification
        run: npm run security:verify


  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4


  # CodeQL requires actions: read to query workflow run information.
  # Fork pull requests are skipped because GitHub restricts write permissions.
  codeql:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v4