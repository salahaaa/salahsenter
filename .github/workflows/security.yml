name: Security Pipeline

on:
  push:
    branches:
      - main
      - master
      - staging

  pull_request:
    branches:
      - main
      - master
      - staging

  schedule:
    - cron: "17 2 * * 1"

  workflow_dispatch:


permissions:
  contents: read
  security-events: write


jobs:

  dependency-and-secret-scan:

    name: Dependency and Secret Scan

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Checkout repository (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm


      - name: Install dependencies
        run: npm ci


      - name: Run security verification
        run: npm run security:verify



  dependency-review:

    name: Dependency Review

    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    steps:

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4



  codeql:

    name: CodeQL Security Scan (Disabled)

    if: false

    runs-on: ubuntu-latest

    steps:

      - name: CodeQL disabled
        run: echo "CodeQL disabled because GitHub Code Scanning is not enabled"