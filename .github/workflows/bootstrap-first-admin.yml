name: Bootstrap first platform administrator

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type BOOTSTRAP_FIRST_ADMIN to create the first super_admin on the configured database
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: first-platform-admin-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.event.inputs.confirmation == 'BOOTSTRAP_FIRST_ADMIN'
    runs-on: ubuntu-latest
    environment: production
    env:
      # Use a Neon Direct / Unpooled URL here. Never place this value in source.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_BOOTSTRAP_EMAIL }}
      ADMIN_NAME: ${{ secrets.ADMIN_BOOTSTRAP_NAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_BOOTSTRAP_PASSWORD }}
      ALLOW_ADMIN_BOOTSTRAP: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify committed migration history
        run: npm run migrations:verify && npx drizzle-kit check --config=drizzle.config.ts

      - name: Apply pending migrations before bootstrap
        run: npm run db:migrate

      - name: Create the first super administrator exactly once
        run: npm run admin:bootstrap
